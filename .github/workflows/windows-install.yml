name: Windows Install Test

on:
  workflow_dispatch:

jobs:
  # Verify that the published Scoop package installs and runs on Windows
  windows-install:
    runs-on: windows-latest

    steps:
      - name: Install Scoop
        shell: pwsh
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          # Make scoop and installed shims available to subsequent steps
          Join-Path $env:USERPROFILE "scoop\shims" | Out-File -Append $env:GITHUB_PATH

      - name: Install Java
        shell: pwsh
        run: |
          scoop bucket add java
          scoop install java/temurin-lts-jdk

      - name: Add dexter bucket and install
        shell: pwsh
        run: |
          scoop bucket add hlship https://github.com/hlship/scoop-bucket
          scoop install dexter

      - name: Verify dexter runs
        shell: pwsh
        run: dexter --help
