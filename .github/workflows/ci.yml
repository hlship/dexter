name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: DeLaGuardo/setup-clojure@13.6.0
        with:
          cli: latest
          bb: latest
          clj-kondo: latest

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-deps-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-deps-

      - name: Cache clj-kondo
        uses: actions/cache@v4
        with:
          path: .clj-kondo/.cache
          key: ${{ runner.os }}-kondo-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-kondo-

      - name: Lint
        run: bb lint

      - name: Test
        run: bb test

  # Verify that the published Scoop package installs and runs on Windows
  windows-install:
    runs-on: windows-latest
    # TODO: restore condition after verifying: if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Install Scoop
        shell: pwsh
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression

      - name: Install Java
        shell: pwsh
        run: scoop install java/temurin-lts-jdk

      - name: Add dexter bucket and install
        shell: pwsh
        run: |
          scoop bucket add hlship https://github.com/hlship/scoop-bucket
          scoop install dexter

      - name: Verify dexter runs
        shell: pwsh
        run: dexter --help
